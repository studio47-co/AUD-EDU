<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Sem conexão · AUDMANI Education</title>
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/ava-core.css">
<link rel="stylesheet" href="css/education.css">
</head>
<body>
<main class="view" style="min-height:100vh;display:grid;place-items:center;padding:24px">
  <section class="card" style="max-width:460px;width:100%;display:flex;flex-direction:column;gap:16px" aria-labelledby="t">
    <div class="brand" style="padding:0"><div class="brand-mark">A</div><div><b>AUDMANI</b><small>Education</small></div></div>
    <h1 id="t" style="font-size:1.5rem">Você está sem conexão</h1>
    <p class="muted">Não foi possível carregar esta página. Seu progresso, suas respostas e o tema escolhido continuam salvos neste dispositivo.</p>
    <div class="row" style="display:flex;gap:12px;flex-wrap:wrap">
      <a class="btn btn-solid" href="./index.html#/inicio">Voltar ao início</a>
      <button class="btn btn-soft" type="button" id="de-novo">Tentar novamente</button>
    </div>
  </section>
</main>
<script>
  /* Tema: mesma chave de armazenamento da plataforma (leitura apenas). */
  try {
    var e = JSON.parse(localStorage.getItem("audmani-education-v1") || "null");
    if (e && e.tema) document.documentElement.setAttribute("data-theme", e.tema);
  } catch (_) {}
  document.getElementById("de-novo").addEventListener("click", function () { location.reload(); });
</script>
</body>
</html>
